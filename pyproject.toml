[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-lightroom"
version = "0.1.0"
description = "Non-destructive desktop photo editor with an AI editing planner"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "PySide6-Essentials>=6.7,<7",
  "numpy>=2.0,<3",
  "opencv-python-headless>=4.10,<5",
  "Pillow>=10.4,<13",
  "pydantic>=2.8,<3",
  "python-dotenv>=1.0,<2",
  "google-genai>=1.0,<2",
  "platformdirs>=4.2,<5",
  "scipy>=1.14,<2",
  "psutil>=6,<8",
]

[project.scripts]
ai-lightroom = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
